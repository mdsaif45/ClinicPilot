<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    ClinicPilot app mark.

    A rising line that behaves as an ECG trace on its way up: the pulse dip and
    spike sit mid-path, and the stroke resolves into an arrowhead at the top
    right. Reads as "clinic" and "growth" at once — Know. Grow. Repeat.

    Kept to a single heavy stroke with generous spacing so it survives at 48dp,
    where thin detail would collapse.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F5132"/>
      <stop offset="100%" stop-color="#198754"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="#FFFFFF" stroke-width="34"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- baseline -> pulse dip/spike -> rise to the arrow -->
    <path d="M104 330 H164 L196 264 L232 372 L272 300 H310 L400 176"/>
    <!-- arrowhead -->
    <path d="M330 168 H408 V246"/>
  </g>
</svg>
