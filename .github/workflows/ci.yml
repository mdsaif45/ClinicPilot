name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Code generation (Drift ORM)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test

      - name: Post PR Failure Report & Merge Block
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '### ❌ Pull Request Validation Failed',
              '',
              'Automated quality checks failed on this Pull Request.',
              '**Merging into `main` is blocked** until all tests and static analysis pass.',
              '',
              '#### 🛠 How to Resolve & Retry:',
              '1. Review the failing step in the **Checks** tab of this PR.',
              '2. Run `flutter analyze --no-fatal-infos` and `flutter test` locally to reproduce and fix the issues.',
              '3. Push your fix commits to this branch. Stale runs will cancel and CI will re-verify automatically.'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
