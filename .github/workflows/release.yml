name: Build & Release ClinicPilot APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Run code generation (Drift ORM)
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      # `secrets` is not available to `if:`, so promote it to `env` first.
      # Passing the values through env also keeps passwords out of the script text,
      # which would otherwise break on quotes or `$` characters.
      - name: Decode keystore and write key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/clinicpilot-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=clinicpilot-release.jks
          EOF

      - name: Report signing mode
        run: |
          if [ -f android/key.properties ]; then
            echo "Building RELEASE-SIGNED APK (keystore secrets present)"
          else
            echo "::warning::No keystore secrets found - APK will be DEBUG-SIGNED and cannot upgrade a release-signed install"
          fi

      # One APK per CPU architecture instead of a single universal one - the
      # native sqlite3/sqlcipher libraries are bundled per-ABI, and shipping
      # only the ABI a phone actually needs is most of that saved size.
      - name: Build Android APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # update_service.dart matches on the {arch} segment of this name
      # against AndroidDeviceInfo.supportedAbis, so the naming here and the
      # matching there must stay in step.
      - name: Rename APKs with version and architecture
        run: |
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in
            v*) : ;;
            *)  VERSION="dev-${GITHUB_SHA::7}" ;;
          esac
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            arch="${f#app-}"
            arch="${arch%-release.apk}"
            mv "$f" "ClinicPilot-${VERSION}-${arch}-release.apk"
            echo "Renamed to ClinicPilot-${VERSION}-${arch}-release.apk"
          done

      # Always available, even for workflow_dispatch runs with no tag
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clinicpilot-apk
          path: build/app/outputs/flutter-apk/ClinicPilot-*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ClinicPilot ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/ClinicPilot-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
