name: Build & Release ClinicPilot APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation (Drift ORM)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Release Asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: ClinicPilot ${{ github.ref_name }}
          body: |
            ## ClinicPilot v0.1.0 Release 🚀
            *Tagline: Know. Grow. Repeat.*

            ### Key Features included in v0.1:
            - 📊 **Dashboard**: Live Revenue, Expenses, Net Profit, Patients, Monthly Goal Progress.
            - 👤 **Patient Registration**: Offline-first registration (Name, Phone, Age, Gender, Disease, Referral Source).
            - 🧾 **Cash Memo & PDF Receipt**: Billing calculations, payment methods (Cash, UPI, Card, Bank), and PDF print/share receipt.
            - 💸 **Expense Tracker**: Expense entries with categories (Rent, Electricity, Medicine, Marketing, Camp, Other).
            - 📈 **Growth Analyzer**: Interactive `fl_chart` financial trends, referral pie chart, disease distribution.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
